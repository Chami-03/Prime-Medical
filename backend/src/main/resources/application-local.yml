# Local (developer) profile - use local MySQL primemedical_db
server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/primemedical_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456789
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
    database-platform: org.hibernate.dialect.MySQLDialect

app:
  notification:
    email:
      from: ${MAIL_FROM:${MAIL_USERNAME:support.primemedical@gmail.com}}
    sms:
      force-destination-number: ${SMS_FORCE_DESTINATION_NUMBER:+94775244117}
      notifylk:
        enabled: ${SMS_NOTIFYLK_ENABLED:true}
        api-url: ${SMS_NOTIFYLK_API_URL:https://app.notify.lk/api/v1/send}
        api-key: ${SMS_NOTIFYLK_API_KEY:E2KBsRNHdPb4qaqrTHiE}
        sender-id: ${SMS_NOTIFYLK_SENDER_ID:}
        user-id: ${SMS_NOTIFYLK_USER_ID:31286}

# keep the rest of app settings (JWT, swagger, etc.) via defaults from application.yml
