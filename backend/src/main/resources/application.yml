# ============================================================
# PrimeMedical — Application Configuration
# ============================================================

server:
  port: 8080

# ── MySQL Datasource ─────────────────────────────────────────
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/primemedical_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456789

    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # ── JPA / Hibernate ──────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        "[format_sql]": true
        "[dialect]": org.hibernate.dialect.MySQLDialect

  # ── Gmail SMTP Mail ─────────────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:support.primemedical@gmail.com}
    password: ${MAIL_PASSWORD:yfvoyanzextctbgx}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ── JWT Configuration ──────────────────────────────────────────
app:
  notification:
    email:
      from: ${MAIL_FROM:${MAIL_USERNAME:support.primemedical@gmail.com}}
    sms:
      force-destination-number: ${SMS_FORCE_DESTINATION_NUMBER:+94775244117}
      notifylk:
        enabled: ${SMS_NOTIFYLK_ENABLED:true}
        api-url: ${SMS_NOTIFYLK_API_URL:https://app.notify.lk/api/v1/send}
        api-key: ${SMS_NOTIFYLK_API_KEY:}
        sender-id: ${SMS_NOTIFYLK_SENDER_ID:}
        user-id: ${SMS_NOTIFYLK_USER_ID:}
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyForDevOnly_ChangeInProduction_AtLeast256Bits!!}
    expiration-ms: 86400000       # 24 hours
    refresh-expiration-ms: 604800000  # 7 days
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
  ai:
    provider: ${APP_AI_PROVIDER:auto}
    api-url: ${APP_AI_API_URL:https://api.openai.com/v1/chat/completions}
    model: ${APP_AI_MODEL:gpt-4o-mini}
    api-key: ${APP_AI_API_KEY:${OPENAI_API_KEY:${OPENROUTER_API_KEY:}}}

# ── SpringDoc / Swagger ───────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# ── Logging ───────────────────────────────────────────────────
logging:
  level:
    "[com.primemedical]": DEBUG
    "[org.springframework.security]": DEBUG
    "[org.hibernate.SQL]": DEBUG
    "[org.hibernate.type.descriptor.sql]": TRACE
    "[org.hibernate.orm.results]": DEBUG
