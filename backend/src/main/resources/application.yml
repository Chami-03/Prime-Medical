# ============================================================
# PrimeMedical — Application Configuration
# ============================================================

server:
  port: 8080

# ── MySQL Datasource ─────────────────────────────────────────
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/medcenter_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456789

    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # ── JPA / Hibernate ──────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # ── Gmail SMTP Mail ─────────────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ── JWT Configuration ──────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:defaultSecretKeyForDevOnly_ChangeInProduction_AtLeast256Bits!!}
    expiration-ms: 86400000       # 24 hours
    refresh-expiration-ms: 604800000  # 7 days
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

# ── SpringDoc / Swagger ───────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

# ── Logging ───────────────────────────────────────────────────
logging:
  level:
    com.medcenter: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.hibernate.orm.results: DEBUG
